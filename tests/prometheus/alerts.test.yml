- name: target-down
  input_series:
  - series: up{job="sre-api",instance="app:8000"}
    values: 0+0x5
  alert_rule_test:
  - eval_time: 3m
    alertname: SreApiUnavailable
    exp_alerts:
    - exp_labels:
        severity: critical
        service: sre-api
        job: sre-api
      exp_annotations: &id001
        summary: No healthy API scrape targets
        runbook_url: https://github.com/jdj333/kubernetes-sre-observability/blob/main/docs/runbook.md#missing-telemetry
- name: target-missing
  input_series: []
  alert_rule_test:
  - eval_time: 3m
    alertname: SreApiUnavailable
    exp_alerts:
    - exp_labels:
        severity: critical
        service: sre-api
        job: sre-api
      exp_annotations: *id001
- name: one-replica-healthy
  input_series:
  - series: up{job="sre-api",instance="a"}
    values: 0+0x5
  - series: up{job="sre-api",instance="b"}
    values: 1+0x5
  alert_rule_test:
  - eval_time: 3m
    alertname: SreApiUnavailable
    exp_alerts: []
