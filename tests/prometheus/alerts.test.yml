rule_files:
- ../../observability/prometheus/rules/alerts.yml
evaluation_interval: 1m
tests:
- name: availability Page sustained
  interval: 1m
  input_series:
  - series: sre:availability:bad_ratio1h{job="sre-api"}
    values: 0.02+0x15
  - series: sre:availability:bad_ratio5m{job="sre-api"}
    values: 0.02+0x15
  alert_rule_test:
  - eval_time: 10m
    alertname: AvailabilityBudgetBurnPage
    exp_alerts:
    - exp_labels:
        severity: critical
        service: sre-api
        slo: availability
        job: sre-api
      exp_annotations:
        summary: Availability error budget is burning too fast
        description: Both 1h and 5m exceed 14.4x budget burn. Inspect request rate,
          errors, latency, and traces.
        runbook_url: https://github.com/jdj333/kubernetes-sre-observability/blob/main/docs/runbook.md#budget-burn
- name: availability Page healthy
  interval: 1m
  input_series:
  - series: sre:availability:bad_ratio1h{job="sre-api"}
    values: 0+0x15
  - series: sre:availability:bad_ratio5m{job="sre-api"}
    values: 0+0x15
  alert_rule_test:
  - eval_time: 10m
    alertname: AvailabilityBudgetBurnPage
    exp_alerts: []
- name: availability Page short-spike
  interval: 1m
  input_series:
  - series: sre:availability:bad_ratio1h{job="sre-api"}
    values: 0+0x15
  - series: sre:availability:bad_ratio5m{job="sre-api"}
