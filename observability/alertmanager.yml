global:
  resolve_timeout: 5m
route:
  receiver: lab-only
  group_by:
  - alertname
  - service
  - slo
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
- name: lab-only
inhibit_rules:
- source_matchers:
  - severity="critical"
  target_matchers:
  - severity="warning"
  equal:
  - service
  - slo
