global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: sre-api
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - sre-lab
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    regex: sre-api
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_phase
    regex: Running
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
