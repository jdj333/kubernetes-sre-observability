services:
  app:
    build: .
    image: sre-api:local
    environment:
      ENABLE_FAULT_INJECTION: 'true'
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      ENVIRONMENT: compose
    ports:
    - 127.0.0.1:8000:8000
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')
      interval: 5s
      timeout: 2s
      retries: 12
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=31d
    - --enable-feature=exemplar-storage
    volumes:
    - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    - prometheus-data:/prometheus
    ports:
    - 127.0.0.1:9090:9090
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
    - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
    - 127.0.0.1:9093:9093
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command:
    - --config=/etc/otelcol/config.yml
    volumes:
    - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
  tempo:
    image: grafana/tempo:2.8.2
    command:
    - -config.file=/etc/tempo/config.yml
    volumes:
    - ./observability/tempo.yml:/etc/tempo/config.yml:ro
    - tempo-data:/var/tempo
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run bash scripts/init-env.sh
        first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:3000:3000
volumes:
  prometheus-data: {}
  tempo-data: {}
